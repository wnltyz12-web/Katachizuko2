<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カタオカサービス</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    :root{
      --bg: #f4f1ea;

      --ink-1: rgba(45,37,28,.96);
      --ink-2: rgba(66,55,41,.84);
      --ink-3: rgba(66,55,41,.70);
      --ink-4: rgba(66,55,41,.56);

      --line: rgba(66,55,41,.14);
      --line-strong: rgba(66,55,41,.22);

      --accent: rgba(155,122,52,.92);
      --accent-line: rgba(155,122,52,.72);

      /* 기본 버튼(料金表은 이 색 그대로) */
      --btn: #b7a18a;
      --btn-text: #ffffff;

      /* 버튼 컬러 */
      --btn-guarantee: #968444; /* 身元保証 */
      --btn-support: #497790;   /* 生活支援 */

      --mobile-max: 520px;
      --shadow2: 0 10px 26px rgba(0,0,0,.14);

      --orn-size: 360px 360px;
      --orn-size-lg: 460px 460px;

      --card-veil: rgba(255,255,255,.14);
      --panel-veil: rgba(255,255,255,.14);

      --sans: "Noto Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      --serif: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;

      --fs-12: 12px;
      --fs-13: 13px;
      --fs-14: 14px;
      --fs-15: 15px;
      --fs-16: 16px;
      --fs-18: 18px;

      --r-14: 14px;
      --r-18: 18px;

      --blur-panel: 10px;
      --blur-card: 14px;

      --panel-pad: 16px;
      --cards-gap: 12px;
      --card-pad-y: 14px;
      --card-pad-x: 14px;

      --body-lh: 2.02;
      --sub-lh: 1.78;

      --title-letter: .12em;
      --h3-letter: .10em;
    }

    body{
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink-3);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Background */
    .ornament-bg{
      position: fixed; inset: 0; z-index: 0;
      background-color: var(--bg);
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: var(--orn-size);
    }
    @media (min-width: 900px){ .ornament-bg{ background-size: var(--orn-size-lg); } }
    .ornament-bg::after{
      content:"";
      position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(244,241,234,0) 0%,
        rgba(244,241,234,0) 40%,
        rgba(255,255,255,0.52) 72%,
        rgba(255,255,255,0.92) 100%
      );
    }

    /* Header */
    .topbar{
      position: sticky; top: 0; z-index: 50;
      height: 78px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #e6ddd2 0%, #ded4c8 100%);
      border-bottom: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 10px 22px rgba(0,0,0,.06);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: height .22s ease, box-shadow .22s ease;
    }
    .topbar.is-compact{ height: 64px; box-shadow: 0 8px 18px rgba(0,0,0,.06); }

    .topbar-inner{
      width: 100%;
      max-width: var(--mobile-max);
      padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }

    .brand{
      display: inline-flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--ink-1);
      min-width: 0;
    }
    .brand-mark{
      width: 44px; height: 44px; border-radius: 999px;
      display: grid; place-items: center;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 16px;
      letter-spacing: .06em;
      border: 1.5px solid rgba(0,0,0,.76);
      background: rgba(255,255,255,.36);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.62);
      flex: 0 0 auto;
      transition: width .22s ease, height .22s ease, transform .22s ease;
    }
    .topbar.is-compact .brand-mark{ width: 38px; height: 38px; transform: translateY(-.5px); }

    .brand-text{
      display: flex;
      flex-direction: column;
      line-height: 1.05;
      gap: 5px;
      min-width: 0;
    }
    .brand-eyebrow{
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(155,122,52,.40);
      background: rgba(255,255,255,.22);
      font-size: 11px;
      letter-spacing: .22em;
      color: rgba(96,84,64,.88);
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-name{
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .14em;
      color: rgba(31,27,22,.96);
      text-shadow: 0 1px 0 rgba(255,255,255,.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: font-size .22s ease, letter-spacing .22s ease;
    }
    .topbar.is-compact .brand-name{ font-size: 16px; letter-spacing: .12em; }

    .header-actions{ display: inline-flex; align-items: center; gap: 10px; flex: 0 0 auto; }

    .hbtn{
      border: 1px solid rgba(0,0,0,.14);
      background: rgba(255,255,255,.40);
      color: rgba(31,27,22,.90);
      border-radius: 999px;
      height: 38px; padding: 0 12px;
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none;
      font-size: var(--fs-12);
      letter-spacing: .12em;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.62);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      user-select: none;
      white-space: nowrap;
    }
    .hbtn:hover{
      transform: translateY(-0.5px);
      background: rgba(255,255,255,.54);
      box-shadow: 0 10px 22px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.72);
    }
    .hbtn.primary{
      background: rgba(183,161,138,.96);
      color: #fff;
      border: 1px solid rgba(0,0,0,.10);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }
    .hbtn.primary:hover{ background: rgba(183,161,138,1); box-shadow: 0 12px 26px rgba(0,0,0,.10); }
    .hbtn .ico{ width: 18px; height: 18px; display: inline-block; }
    @media (max-width: 420px){ .header-actions .hbtn.secondary{ display: none; } }

    /* Layout */
    .page{ position: relative; z-index: 1; min-height: 100vh; display: flex; justify-content: center; }
    .container{ width: 100%; max-width: var(--mobile-max); padding: 18px 16px 170px; }

    /* HERO */
    .hero{ margin-top: 18px; padding: 6px 0 0; text-align: center; }
    .hero-title{
      font-family: var(--serif);
      letter-spacing: .10em;
      color: rgba(96,84,64,.92);
      font-weight: 900;
      font-size: 16px;
      line-height: 1.95;
    }
    .hero-label-wrap{ margin-top: 12px; display: grid; place-items: center; }
    .hero-label{
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 14px;
      border-radius: 6px;
      border: 2px solid var(--accent-line);
      color: var(--accent);
      font-family: var(--serif);
      font-weight: 900;
      font-size: var(--fs-13);
      letter-spacing: .22em;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      user-select: none;
    }

    .hero-cta{ margin-top: 18px; display: flex; justify-content: center; }
    .hero-cta-row{ display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; width: 100%; }

    .cta-btn{
      appearance: none; border: none; cursor: pointer;
      width: 180px; height: 52px;
      background: var(--btn);
      color: var(--btn-text);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,.14);
      letter-spacing: .14em;
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 900;
      display: inline-flex; align-items: center; justify-content: center;
      transition: box-shadow .18s ease, transform .18s ease, filter .18s ease;
    }
    .cta-btn:hover{ transform: translateY(-0.5px); box-shadow: 0 14px 34px rgba(0,0,0,.17); filter: saturate(1.04); }

    .cta-btn.guarantee{ background: var(--btn-guarantee); }
    .cta-btn.support{ background: var(--btn-support); }

    /* Panels */
    .details{ margin-top: 18px; display: grid; gap: 14px; }

    .panel{
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 14px 34px rgba(0,0,0,.10);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .panel::before{
      content:"";
      position:absolute; inset:-60px;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: var(--orn-size);
      opacity: .32;
      filter: blur(.8px);
      transform: scale(1.05);
      pointer-events:none;
      z-index: 0;
    }
    @media (min-width: 900px){ .panel::before{ background-size: var(--orn-size-lg); } }
    .panel::after{
      content:"";
      position:absolute; inset:0;
      background: rgba(255,255,255,.14);
      pointer-events:none;
      z-index: 0;
    }
    .panel > *{ position: relative; z-index: 1; }

    .panel-head{
      padding: 16px 16px 14px;
      text-align: center;
      background: rgba(255,255,255,.18);
      border-bottom: 1px solid rgba(0,0,0,.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .panel-title{
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .12em;
      color: var(--ink-1);
    }
    .panel-sub{
      margin-top: 6px;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--ink-4);
      letter-spacing: .06em;
      line-height: 1.78;
      padding: 0 6px;
      font-weight: 600;
    }

    .panel-body{ background: rgba(255,255,255,.06); }
    .panel-inner{ padding: 16px 16px 20px; }

    .cards{ display: grid; gap: 12px; margin-top: 10px; }

    .card{
      position: relative;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.07);
      padding: 14px 14px;
      overflow: hidden;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 24px rgba(0,0,0,.06);
    }
    .card::before{
      content:"";
      position:absolute; inset:-44px;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: var(--orn-size);
      opacity: .38;
      filter: blur(.9px);
      transform: scale(1.06);
      pointer-events:none;
      z-index: 0;
    }
    .card::after{
      content:"";
      position:absolute; inset:0;
      background: rgba(255,255,255,.14);
      pointer-events:none;
      z-index: 0;
    }
    .card > *{ position: relative; z-index: 1; }

    .card h3{
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .10em;
      color: var(--ink-1);
      margin-bottom: 10px;
      text-align: left;
    }
    .card p{
      font-family: var(--sans);
      font-size: 15px;
      line-height: 2.02;
      color: var(--ink-3);
      text-align: left;
      letter-spacing: .01em;
      font-weight: 400;
    }

    /* Fee */
    .fee-list{ display: grid; gap: 10px; margin-top: 6px; }
    .fee-item{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
    }
    .fee-name{
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-2);
      line-height: 1.55;
      font-family: var(--sans);
    }
    .fee-price{
      text-align: right;
      font-size: 14px;
      font-weight: 900;
      color: var(--ink-1);
      white-space: nowrap;
      line-height: 1.55;
      font-family: var(--sans);
    }

    /* ✅ 深夜帯만: 색빠진 + 작게 + 1時間 아래 */
    .fee-price .time{
      display:block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(66,55,41,.48);
      letter-spacing: .04em;
      white-space: nowrap;
      font-family: var(--sans);
    }

    /* (22:00~7:00) 표기는 그대로(기본 텍스트) */
    .fee-name .keep{
      font-weight: 800;
      color: var(--ink-2);
      font-size: 14px;
      letter-spacing: 0;
    }

    /* reveal */
    .reveal{ opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .55s ease; }
    .reveal.is-on{ opacity: 1; transform: translateY(0); }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="カタオカサービス トップ">
        <span class="brand-mark" aria-hidden="true">片</span>
        <span class="brand-text">
          <span class="brand-eyebrow">外出支援</span>
          <span class="brand-name">カタオカサービス</span>
        </span>
      </a>

      <div class="header-actions">
        <a class="hbtn secondary" href="#details" aria-label="サービスを見る">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h10M4 18h16"></path>
          </svg>
          サービス
        </a>

        <a class="hbtn primary" href="#panel-contact" aria-label="お問い合わせへ">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16v16H4z"></path>
            <path d="M22 6l-10 7L2 6"></path>
          </svg>
          お問い合わせ
        </a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <section class="hero">
        <div class="hero-title">おひとりさまの方へ</div>
        <div class="hero-title">子供や孫に迷惑をかけたくない方へ</div>

        <div class="hero-label-wrap">
          <div class="hero-label">地域密着型</div>
        </div>

        <div class="hero-cta">
          <div class="hero-cta-row">
            <button class="cta-btn guarantee" type="button"
              onclick="document.getElementById('panel-guarantee').scrollIntoView({behavior:'smooth',block:'start'})">
              身元保証
            </button>

            <button class="cta-btn support" type="button"
              onclick="document.getElementById('panel-support').scrollIntoView({behavior:'smooth',block:'start'})">
              生活支援
            </button>

            <button class="cta-btn" type="button"
              onclick="document.getElementById('panel-price').scrollIntoView({behavior:'smooth',block:'start'})">
              料金表
            </button>
          </div>
        </div>
      </section>

      <section class="details" id="details">
        <article class="panel" id="panel-price">
          <div class="panel-head">
            <div class="panel-title">料金表</div>
            <div class="panel-sub">
              入会金・月会費、各プランの料金目安です<br/>
              （すべて税込）
            </div>
          </div>

          <div class="panel-body">
            <div class="panel-inner">
              <div class="cards">
                <div class="card">
                  <h3>生活支援プラン</h3>

                  <div class="fee-list">
                    <div class="fee-item">
                      <!-- ✅ (22:00~7:00) 표기 유지 -->
                      <div><div class="fee-name">訪問支援 <span class="keep">(22:00~7:00)</span></div></div>
                      <!-- ✅ 深夜帯만 아래 작게/색빠진 -->
                      <div class="fee-price">6,000円／1時間<span class="time">深夜帯</span></div>
                    </div>

                    <div class="fee-item">
                      <!-- ✅ (22:00~7:00) 표기 유지 -->
                      <div><div class="fee-name">同行支援 <span class="keep">(22:00~7:00)</span></div></div>
                      <!-- ✅ 深夜帯만 아래 작게/색빠진 -->
                      <div class="fee-price">8,000円／1時間<span class="time">深夜帯</span></div>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </article>
      </section>

    </div>
  </main>

  <script>
    const topbarEl = document.getElementById('topbar');
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(() => {
        const y = window.scrollY || 0;
        if (y > 12) topbarEl.classList.add('is-compact');
        else topbarEl.classList.remove('is-compact');
        ticking = false;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
