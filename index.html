<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    /* =========================
       Reset
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    /* =========================
       Background Ornament
    ========================= */
    .ornament-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* =========================
       Top Ivory Bar
    ========================= */
    .top-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    /* =========================
       Page Wrapper
    ========================= */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* =========================
       Japanese Intro Text
    ========================= */
    .japanese-title {
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle {
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider {
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    /* =========================
       Main Frame
    ========================= */
    .frame {
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    /* =========================
       Buttons
    ========================= */
    .button-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* ✅ 너가 준 이미지 톤 기반 (차분한 베이지브라운) */
    .simple-btn {
      width: 320px;
      height: 76px;

      border: none;
      border-radius: 18px;

      /* 핵심: 이미지 느낌 나는 톤 */
      background: linear-gradient(
        180deg,
        #bfa38f 0%,
        #b09480 55%,
        #a98b77 100%
      );

      color: #ffffff;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.12em;

      cursor: pointer;

      /* ✅ 너무 과하지 않은 입체감 */
      box-shadow:
        0 16px 34px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        filter 0.15s ease;
    }

    .simple-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }

    .simple-btn:active {
      transform: translateY(0px);
      filter: brightness(0.98);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.18),
        inset 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    /* =========================
       Responsive
    ========================= */
    @media (max-width: 900px) {
      .simple-btn {
        width: 280px;
        font-size: 24px;
      }
    }

    @media (max-width: 768px) {
      .frame {
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }

      .button-row {
        flex-direction: column;
        gap: 18px;
      }

      .simple-btn {
        width: 100%;
        max-width: 380px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 64px 16px 96px;
      }

      .frame {
        padding: 64px 24px 80px;
      }

      .japanese-title .subtitle {
        font-size: 16px;
      }

      .simple-btn {
        height: 70px;
        font-size: 23px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Background Ornament -->
  <div class="ornament-bg"></div>

  <!-- Top Bar -->
  <div class="top-bar"></div>

  <!-- Page -->
  <main class="page">
    <div class="container">

      <!-- Intro Text -->
      <div
