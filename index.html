<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    .frame{
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================================================
       Ornament Line Button (정확한 형태)
       - 버튼은 투명
       - 위 장식 + 아래 장식 2개의 레이어를 실제 요소로 둠
       - 텍스트 중앙 정렬
    ========================================================= */
    .line-btn{
      position: relative;
      width: 460px;
      height: 150px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .line-btn .orn-top,
    .line-btn .orn-bot{
      position: absolute;
      left: 0;
      right: 0;
      height: 56px;
      background-image: url("Untitled-1.png");
      background-repeat: no-repeat;
      background-size: 120% auto;
      opacity: 0.95;
      pointer-events: none;
    }

    /* ✅ 네가 준 샘플처럼 "윗줄"만 나오게 */
    .line-btn .orn-top{
      top: 10px;
      background-position: center 26%;
    }

    /* ✅ 네가 준 샘플처럼 "아랫줄"만 나오게 */
    .line-btn .orn-bot{
      bottom: 10px;
      background-position: center 74%;
    }

    .line-btn .label{
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #2f2a22;
    }

    .line-btn:hover .orn-top,
    .line-btn:hover .orn-bot{
      opacity: 1;
    }

    /* =========================
       Responsive
    ========================= */
    @media (max-width: 1000px){
      .line-btn{ width: 420px; }
      .line-btn .label{ font-size: 26px; }
    }

    @media (max-width: 768px){
      .frame{
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }

      .button-row{
        flex-direction: column;
        gap: 18px;
      }

      .line-btn{
        width: 100%;
        max-width: 520px;
        height: 150px;
      }
    }

    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }

      .line-btn{ height: 140px; }
      .line-btn .label{ font-size: 24px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <button class="line-btn" type="button" aria-label="身元保証">
            <span class="orn-top"></span>
            <span class="orn-bot"></span>
            <span class="label">身元保証</span>
          </button>

          <button class="line-btn" type="button" aria-label="生活支援">
            <span class="orn-top"></span>
            <span class="orn-bot"></span>
            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
