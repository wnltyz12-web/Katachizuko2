<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ornament Archive Layout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4f1ea;
      font-family: "Noto Sans KR", sans-serif;
    }

    /* ==============================
       전체 오나먼트 배경
    ============================== */
    .ornament-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 840px 840px;
      opacity: 1;
    }

    /* ==============================
       페이지 래퍼
    ============================== */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 180px 40px 220px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ==============================
       오나먼트 프레임
    ============================== */
    .frame {
      position: relative;
      width: 100%;
      max-width: 1200px;
      padding: 96px 88px;
      background-color: #f7f5ef;
      box-shadow:
        0 40px 120px rgba(0,0,0,0.25),
        inset 0 0 0 1px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* 프레임 바깥 오나먼트 */
    .frame::before {
      content: "";
      position: absolute;
      inset: -48px;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 840px 840px;
      background-attachment: fixed;
      z-index: -1;
      filter: contrast(0.9) brightness(1.05);
      transform: translateZ(0);
    }

    /* 프레임 안쪽 라인 */
    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,0,0,0.12);
      pointer-events: none;
    }

    /* ==============================
       타이틀 영역
    ============================== */
    .title {
      text-align: center;
      margin-bottom: 96px;
    }

    .title h1 {
      margin: 0 0 16px;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.35em;
    }

    .title p {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.4em;
      opacity: 0.55;
    }

    /* ==============================
       메인 콘텐츠
    ============================== */
    .content {
      width: 100%;
      aspect-ratio: 1024 / 1536;
      background: #1a1a1a;
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    }

    /* ==============================
       반응형
    ============================== */
    @media (max-width: 1024px) {
      .frame {
        padding: 72px 56px;
      }

      .content {
        aspect-ratio: 3 / 4;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 120px 20px 160px;
      }

      .frame {
        padding: 48px 28px;
      }

      .title {
        margin-bottom: 64px;
      }
    }
  </style>
</head>
<body>

  <!-- 전체 배경 오나먼트 -->
  <div class="ornament-bg"></div>

  <!-- 페이지 -->
  <main class="page">
    <section class="frame">

      <header class="title">
        <h1>WELFARE DESIGN</h1>
        <p>ARCHIVE — 2026</p>
      </header>

      <section class="content"></section>

    </section>
  </main>

</body>
</html>
