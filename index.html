<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カタオカサービス</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body{
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: #f4f1ea;
      color: #2f2a22;
    }

    :root{
      --btn: #b7a18a;
      --btn-text: #ffffff;

      --mobile-max: 520px;

      --shadow: 0 20px 55px rgba(0,0,0,.16);
      --shadow2: 0 10px 26px rgba(0,0,0,.14);

      --ink: #2f2a22;
      --muted: rgba(47,42,34,.72);
      --line: rgba(47,42,34,.16);
      --paper: rgba(255,255,255,.70);
    }

    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* header */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      height: 68px;
      background: #ded4c8;
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .topbar .wrap{
      width: 100%;
      max-width: var(--mobile-max);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo{
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .logo-mark{
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.85);
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.35);
    }
    .logo-mark span{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .04em;
    }

    .brand-title{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 16px;
      letter-spacing: .06em;
      color: #1f1b16;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-title b{ font-weight: 900; }

    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container{
      width: 100%;
      max-width: var(--mobile-max);
      padding: 18px 16px 140px;
    }

    /* hero ornament frame */
    .orn-frame{
      position: relative;
      margin-top: 18px;
      padding: 46px 22px 40px;
      border-radius: 22px;

      background-color: var(--paper);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 145% auto;

      box-shadow: var(--shadow);
    }

    .orn-title{
      text-align: center;
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      letter-spacing: .10em;
      color: var(--ink);
    }
    .orn-title .line{
      font-size: 16px;
      font-weight: 800;
      line-height: 1.9;
    }

    /* CTA */
    .cta-section{
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .cta-row{
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      width: 100%;
    }

    .cta-btn{
      appearance: none;
      border: none;
      cursor: pointer;

      width: 230px;
      height: 62px;

      background: var(--btn);
      color: var(--btn-text);

      border-radius: 16px;
      box-shadow: var(--shadow2);
      letter-spacing: .16em;

      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 22px;
      font-weight: 900;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition: box-shadow .18s ease, transform .18s ease, filter .18s ease;
    }

    .cta-btn:hover{
      transform: translateY(-0.5px);
      box-shadow: 0 14px 34px rgba(0,0,0,.17);
      filter: saturate(1.02);
    }
    .cta-btn:active{
      transform: translateY(0px);
      box-shadow: 0 9px 24px rgba(0,0,0,.14);
      filter: saturate(1);
    }

    .cta-message{
      margin-top: 14px;
      text-align: center;

      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      color: var(--muted);

      font-size: 14px;
      line-height: 1.9;
      letter-spacing: .06em;
    }

    /* separator */
    .section-sep{
      margin: 22px 0 6px;
      width: 100%;
      display: grid;
      place-items: center;
      gap: 10px;
    }
    .section-sep .line{
      width: 92%;
      height: 1px;
      background: var(--line);
    }
    .section-sep .diamond{
      font-size: 12px;
      color: rgba(47,42,34,.35);
      transform: translateY(-2px);
      letter-spacing: .2em;
      user-select: none;
    }

    /* =========================
       Always-open Sections
    ========================= */
    .details{
      margin-top: 18px;
      display: grid;
      gap: 14px;
    }

    .panel{
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 14px 34px rgba(0,0,0,.10);
      overflow: hidden;

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 140% auto;
    }

    .panel-head{
      padding: 16px 16px;
      background: rgba(255,255,255,.65);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }

    .panel-title{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .12em;
      color: var(--ink);
      text-align: center;
    }

    .panel-body{
      background: rgba(255,255,255,.55);
    }
    .panel-inner{
      padding: 16px 16px 18px;
    }

    /* bullet list (as your images) */
    .bullets{
      margin-top: 6px;
      padding-left: 18px;
      display: grid;
      gap: 10px;
      list-style: disc;
    }
    .bullets li{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .06em;
      line-height: 1.5;
      color: rgba(47,42,34,.90);
    }

    .note{
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: rgba(47,42,34,.60);
      letter-spacing: .04em;
    }

    /* reveal */
    .reveal{
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .reveal.is-on{
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 360px){
      .cta-btn{ width: 210px; font-size: 20px; }
      .cta-message{ font-size: 12px; letter-spacing: .04em; }
      .bullets li{ font-size: 16px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>

  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true"><span>片</span></div>
      </div>
      <div class="brand-title"><b>外出支援</b>　カタオカサービス</div>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <section class="orn-frame">
        <div class="orn-title">
          <div class="line">おひとりさまの方へ</div>
          <div class="line">子供や孫に迷惑をかけたくない方へ</div>
        </div>
      </section>

      <section class="cta-section reveal" id="cta">
        <div class="cta-row">
          <button class="cta-btn" type="button" onclick="document.getElementById('panel-guarantee').scrollIntoView({behavior:'smooth',block:'start'})">身元保証</button>
          <button class="cta-btn" type="button" onclick="document.getElementById('panel-support').scrollIntoView({behavior:'smooth',block:'start'})">生活支援</button>

          <div class="cta-message">
            皆さまの想いをかなえる ために<br/>
            私たちが一生涯のご支援をお約束致します
          </div>

          <div class="section-sep" aria-hidden="true">
            <div class="line"></div>
            <div class="diamond">◆</div>
            <div class="line"></div>
          </div>
        </div>
      </section>

      <!-- ✅ 클릭하면 펼쳐지는게 아니라, 항상 펼쳐진 상태 -->
      <section class="details" id="details">

        <!-- 身元保証 -->
        <article class="panel" id="panel-guarantee">
          <div class="panel-head">
            <div class="panel-title">身元保証</div>
          </div>
          <div class="panel-body">
            <div class="panel-inner">
              <ul class="bullets">
                <li>身元保証人代行</li>
                <li>緊急連絡先代行</li>
                <li>身元引受人代行</li>
                <li>死後事務委任</li>
              </ul>
            </div>
          </div>
        </article>

        <!-- 生活支援 -->
        <article class="panel" id="panel-support">
          <div class="panel-head">
            <div class="panel-title">生活支援</div>
          </div>
          <div class="panel-body">
            <div class="panel-inner">
              <ul class="bullets">
                <li>通院同行</li>
                <li>買物同行</li>
                <li>役所手続き同行</li>
              </ul>
            </div>
          </div>
        </article>

      </section>

    </div>
  </main>

  <script>
    const revealEl = document.querySelector('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) revealEl.classList.add('is-on'); });
    }, { threshold: 0.18 });
    io.observe(revealEl);
  </script>
</body>
</html>
