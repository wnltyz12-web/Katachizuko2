<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design Archive</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4f1ea;
      font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
      color: #1a1a1a;
    }

    /* ==============================
       상단 아이보리 바
    ============================== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
      z-index: 3;
    }

    /* ==============================
       전체 오나먼트 배경
    ============================== */
    .ornament-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 560px 560px;
      opacity: 1;
    }

    /* ==============================
       페이지 래퍼
    ============================== */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 200px 40px 220px;
      display: flex;
      justify-content: center;
    }

    /* ==============================
       상단 안내 문구
    ============================== */
    .intro-text {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 14px;
      line-height: 1.9;
      letter-spacing: 0.18em;
      color: rgba(0,0,0,0.75);
      z-index: 2;
      white-space: nowrap;
    }

    /* ==============================
       오나먼트 프레임
    ============================== */
    .frame {
      position: relative;
      width: 100%;
      max-width: 1200px;
      padding: 96px 88px 104px;
      background-color: #f7f5ef;
      box-shadow:
        0 40px 120px rgba(0,0,0,0.22),
        inset 0 0 0 1px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: -48px;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 560px 560px;
      background-attachment: fixed;
      z-index: -1;
      transform: translateZ(0);
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,0,0,0.12);
      pointer-events: none;
    }

    /* ==============================
       타이틀
    ============================== */
    .title {
      text-align: center;
      margin-bottom: 88px;
    }

    .title h1 {
      margin: 0 0 14px;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.38em;
    }

    .title p {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.42em;
      opacity: 0.55;
    }

    /* ==============================
       메인 비주얼 영역
    ============================== */
    .content {
      width: 100%;
      aspect-ratio: 1024 / 1536;
      background: #1a1a1a;
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.28);
    }

    /* ==============================
       모바일 대응
    ============================== */
    @media (max-width: 640px) {
      .top-bar {
        height: 56px;
      }

      .page {
        padding: 160px 20px 180px;
      }

      .intro-text {
        top: 76px;
        font-size: 13px;
        letter-spacing: 0.14em;
        white-space: normal;
      }

      .frame {
        padding: 48px 28px 56px;
        box-shadow: none;
        filter: drop-shadow(0 20px 48px rgba(0,0,0,0.3));
      }

      .title {
        margin-bottom: 64px;
      }

      .content {
        aspect-ratio: 3 / 4;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar"></div>
  <div class="ornament-bg"></div>

  <main class="page">

    <div class="intro-text">
      おひとりさまの方へ<br>
      子供や孫に迷惑をかけたくない方へ
    </div>

    <section class="frame">

      <header class="title">
        <h1>WELFARE DESIGN</h1>
        <p>ARCHIVE — 2026</p>
      </header>

      <section class="content"></section>

    </section>
  </main>

</body>
</html>
