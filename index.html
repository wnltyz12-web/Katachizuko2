<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    .ornament-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    .top-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .japanese-title {
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .subtitle-box {
      background-color: #f0e0c1;
      padding: 10px 22px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
    }

    .subtitle {
      display: block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
    }

    .divider {
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
    }

    .frame {
      position: relative;
      padding: 96px 64px 112px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    .main-title {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 36px;
      line-height: 1.7;
      letter-spacing: 0.12em;
      color: #2f2a22;
      margin-bottom: 32px;
      word-break: keep-all;
    }

    .main-title span {
      display: block;
      margin-top: 0.4em;
      font-size: 22px;
      letter-spacing: 0.18em;
      line-height: 1.6;
      color: #6a5f4a;
    }

    @media (max-width: 768px) {
      .frame { padding: 72px 32px 88px; background-size: 140% auto; }
      .main-title { font-size: 28px; }
      .main-title span { font-size: 18px; }
      .subtitle-box { padding: 10px 18px; border-radius: 10px; }
    }

    @media (max-width: 480px) {
      .page { padding: 64px 16px 96px; }
      .frame { padding: 64px 24px 80px; }
      .subtitle { font-size: 16px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">
      <div class="japanese-title">
        <div class="subtitle-box"><span class="subtitle">おひとりさまの方へ</span></div>
        <span class="divider"></span>
        <div class="subtitle-box"><span class="subtitle">子供や孫に迷惑をかけたくない方へ</span></div>
      </div>

      <section class="frame">
        <h1 class="main-title">
          人生の最期まで、
          <span>安心できる選択を。</span>
        </h1>
      </section>
    </div>
  </main>
</body>
</html>
