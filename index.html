<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カタオカサービス</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body{
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: #f4f1ea;
      color: #2f2a22;
    }

    :root{
      --mobile-max: 520px;

      --shadow: 0 20px 55px rgba(0,0,0,.16);
      --shadow2: 0 10px 26px rgba(0,0,0,.14);

      --ink: #2f2a22;
      --muted: rgba(47,42,34,.72);
      --line: rgba(47,42,34,.16);
      --paper: rgba(255,255,255,.70);

      --card: rgba(255,255,255,.78);
      --card-border: rgba(0,0,0,.06);
    }

    /* =========================
       Background Ornament + Bottom Fade
    ========================= */
    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 320px 320px;
    }
    @media (min-width: 900px){
      .ornament-bg{ background-size: 420px 420px; }
    }
    .ornament-bg::after{
      content:"";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(244,241,234,0) 0%,
        rgba(244,241,234,0) 45%,
        rgba(255,255,255,0.55) 75%,
        rgba(255,255,255,0.92) 100%
      );
    }

    /* =========================
       Header (Refined + CTA + Shrink on scroll)
    ========================= */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;

      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(180deg, #e6ddd2 0%, #ded4c8 100%);
      border-bottom: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 10px 22px rgba(0,0,0,.06);
      backdrop-filter: blur(6px);

      transition: height .22s ease, box-shadow .22s ease;
    }
    .topbar.is-compact{
      height: 64px;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }

    .topbar-inner{
      width: 100%;
      max-width: var(--mobile-max);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand{
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #1f1b16;
      min-width: 0;
    }

    .brand-mark{
      width: 44px;
      height: 44px;
      border-radius: 999px;

      display: grid;
      place-items: center;

      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: .04em;

      border: 1.5px solid rgba(0,0,0,.78);
      background: rgba(255,255,255,.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55);

      transition: width .22s ease, height .22s ease, transform .22s ease;
      flex: 0 0 auto;
    }
    .topbar.is-compact .brand-mark{
      width: 38px;
      height: 38px;
      transform: translateY(-.5px);
    }

    .brand-text{
      display: flex;
      flex-direction: column;
      line-height: 1.05;
      gap: 6px;
      min-width: 0;
    }

    .brand-eyebrow{
      font-size: 12px;
      letter-spacing: .18em;
      color: rgba(31,27,22,.78);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-name{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .10em;
      color: #1f1b16;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      transition: font-size .22s ease, letter-spacing .22s ease;
    }
    .topbar.is-compact .brand-name{
      font-size: 16px;
      letter-spacing: .08em;
    }

    .header-actions{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .hbtn{
      border: 1px solid rgba(0,0,0,.14);
      background: rgba(255,255,255,.40);
      color: rgba(31,27,22,.92);
      border-radius: 999px;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: .10em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      user-select: none;
      white-space: nowrap;
    }
    .hbtn.primary{
      background: rgba(183,161,138,.92);
      color: #fff;
      border: 1px solid rgba(0,0,0,.10);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }
    .hbtn .ico{ width: 18px; height: 18px; display: inline-block; }

    @media (max-width: 420px){
      .header-actions .hbtn.secondary{ display: none; }
    }

    /* =========================
       Layout
    ========================= */
    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container{
      width: 100%;
      max-width: var(--mobile-max);
      padding: 18px 16px 140px;
    }

    /* =========================
       TOP TEXT (✅ 가운데 정렬)
    ========================= */
    .hero-text{
      margin-top: 22px;
      text-align: center; /* ✅ 변경 */
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      letter-spacing: .10em;
      color: var(--ink);
      padding: 0 4px;
    }
    .hero-text .line{
      font-size: 16px;
      font-weight: 800;
      line-height: 1.95;
    }

    /* =========================
       Two Buttons inline (✅ 버튼도 가운데)
    ========================= */
    .hero-actions{
      margin-top: 14px;
      display: flex;
      gap: 12px;
      justify-content: center; /* ✅ 변경 */
      padding: 0 4px;
    }

    .hero-btn{
      appearance: none;
      border: none;
      cursor: pointer;

      height: 44px;
      padding: 0 16px;

      border-radius: 12px;
      color: #fff;

      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: .12em;

      box-shadow: 0 12px 24px rgba(0,0,0,.14);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .hero-btn.guarantee{ background: #968444; }
    .hero-btn.support{ background: #497790; }

    /* =========================
       Illustration
    ========================= */
    .illus-wrap{ margin-top: 18px; }
    .illus-inner{
      display: grid;
      place-items: center;
      gap: 12px;
      text-align: center;
    }
    .illus-img{
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      box-shadow: 0 14px 34px rgba(0,0,0,.12);
    }

    /* ✅ 'もしもの時〜' 아래 배치 */
    .illus-kicker{
      margin-top: 6px;
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-weight: 900;
      letter-spacing: .10em;
      color: rgba(47,42,34,.88);
      font-size: 14px;
      line-height: 1.75;
    }

    .illus-caption{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 13px;
      letter-spacing: .06em;
      line-height: 1.9;
      color: rgba(47,42,34,.70);
      text-align: center;
    }

    /* ✅ 중요 키워드 볼드 */
    .illus-caption b{
      font-weight: 900;
      color: rgba(47,42,34,.92);
    }

    /* reveal */
    .reveal{
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .reveal.is-on{
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="カタオカサービス トップ">
        <span class="brand-mark" aria-hidden="true">片</span>
        <span class="brand-text">
          <span class="brand-eyebrow">外出支援</span>
          <span class="brand-name">カタオカサービス</span>
        </span>
      </a>

      <div class="header-actions">
        <a class="hbtn primary" href="#details" aria-label="お問い合わせへ">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16v16H4z"></path>
            <path d="M22 6l-10 7L2 6"></path>
          </svg>
          お問い合わせ
        </a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <section class="hero-text">
        <div class="line">おひとりさまの方へ</div>
        <div class="line">子供や孫に迷惑をかけたくない方へ</div>

        <div class="hero-actions">
          <button class="hero-btn guarantee" type="button">
            身元保証
          </button>

          <button class="hero-btn support" type="button">
            生活支援
          </button>
        </div>
      </section>

      <section class="illus-wrap reveal" id="why">
        <div class="illus-inner">
          <img class="illus-img" src="illustration.png" alt="イラスト" />
          <div class="illus-kicker">「もしもの時」に備えて、今できることを。</div>

          <div class="illus-caption">
            <b>不安</b>をひとつずつ整理し、<br/>
            <b>必要</b>な<b>手続き</b>や<b>支援</b>をわかりやすくご案内します。
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-on'); });
    }, { threshold: 0.14 });
    els.forEach(el => io.observe(el));

    const topbar = document.getElementById('topbar');
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;

      window.requestAnimationFrame(() => {
        const y = window.scrollY || 0;
        if (y > 12) topbar.classList.add('is-compact');
        else topbar.classList.remove('is-compact');
        ticking = false;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
