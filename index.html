<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    /* =========================
       Reset
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    /* =========================
       Background Ornament
    ========================= */
    .ornament-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* =========================
       Top Ivory Bar
    ========================= */
    .top-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    /* =========================
       Page Wrapper
    ========================= */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* =========================
       Japanese Intro Text
    ========================= */
    .japanese-title {
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ✅ 고급 하이라이트 */
    .japanese-title .subtitle {
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider {
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    /* =========================
       Main Frame
    ========================= */
    .frame {
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    /* =========================
       Buttons Section
    ========================= */
    .button-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 32px;
      margin-top: 10px;
    }

    .pill-btn {
      width: 320px;
      height: 74px;
      border-radius: 999px;

      /* ✅ 기존 아이보리 색상으로 통일 */
      background-color: #f0e0c1;

      border: none;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 20px;
      letter-spacing: 0.08em;
      color: #2f2a22;
      font-weight: 800;

      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 50px rgba(0,0,0,0.2);
    }

    .pill-btn:active {
      transform: translateY(0px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.18);
    }

    /* =========================
       Responsive
    ========================= */
    @media (max-width: 900px) {
      .pill-btn {
        width: 280px;
      }
    }

    @media (max-width: 768px) {
      .frame {
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }

      .button-row {
        flex-direction: column;
        gap: 18px;
      }

      .pill-btn {
        width: 100%;
        max-width: 360px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 64px 16px 96px;
      }

      .frame {
        padding: 64px 24px 80px;
      }

      .japanese-title .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Background Ornament -->
  <div class="ornament-bg"></div>

  <!-- Top Bar -->
  <div class="top-bar"></div>

  <!-- Page -->
  <main class="page">
    <div class="container">

      <!-- Intro Text -->
      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <!-- Frame -->
      <section class="frame">

        <!-- ✅ 사진처럼 양쪽 버튼 2개 -->
        <div class="button-row">
          <button class="pill-btn">【身元保証】</button>
          <button class="pill-btn">【生活支援】</button>
        </div>

      </section>

    </div>
  </main>

</body>
</html>
