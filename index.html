<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外出支援 KATAOKAサービス</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  color: #333;
  line-height: 1.9;
}

:root {
  --main: #1f5c73;
  --sub: #e9f2f5;
  --dark: #0f3f52;
  --gray: #f7f7f7;
}

/* ================= HEADER ================= */
header {
  background: var(--main);
  color: #fff;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  padding: 22px 16px;
  text-align: center;
}

.header-inner h1 {
  font-size: 24px;
  font-weight: 600;
}

/* ================= NAV ================= */
nav {
  background: #fff;
  border-bottom: 1px solid #ddd;
}

nav ul {
  display: flex;
  justify-content: center;
  list-style: none;
}

nav li {
  margin: 0 22px;
}

nav a {
  display: block;
  padding: 14px 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--main);
  text-decoration: none;
}

/* ================= HERO (사진 원본 그대로) ================= */
.hero {
  width: 100%;
  max-width: 1024px;
  margin: 0 auto;
  aspect-ratio: 1024 / 1536;

  background-image: url("Image.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  color: #fff;
}

/* 텍스트가 사진 위에 올라가므로 가독성 필요하면
   나중에 text-shadow만 추가하면 됨 */
.hero h2 {
  font-size: 32px;
  margin-bottom: 14px;
}

.hero p {
  font-size: 16px;
}

/* ================= SECTION COMMON ================= */
section {
  padding: 80px 16px;
}

.inner {
  max-width: 1100px;
  margin: auto;
}

.section-title {
  text-align: center;
  margin-bottom: 52px;
}

.section-title h3 {
  font-size: 25px;
  color: var(--main);
}

/* ================= SERVICE ================= */
.services {
  background: var(--sub);
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
}

.service-item {
  background: #fff;
  padding: 34px 26px;
}

.service-item h4 {
  color: var(--main);
  margin-bottom: 10px;
}

/* ================= FLOW ================= */
.flow-list {
  max-width: 720px;
  margin: auto;
}

.flow-item {
  background: #fff;
  padding: 22px 24px;
  margin-bottom: 16px;
  border-left: 6px solid var(--main);
}

/* ================= PRICE ================= */
.price {
  background: var(--gray);
  text-align: center;
}

.price-box {
  display: inline-block;
  background: #fff;
  padding: 36px 60px;
  font-size: 26px;
  font-weight: 600;
  color: var(--dark);
}

/* ================= CONTACT ================= */
.contact {
  background: var(--main);
  color: #fff;
  text-align: center;
}

footer {
  background: var(--dark);
  color: #fff;
  text-align: center;
  padding: 22px;
  font-size: 13px;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {
  .hero {
    max-width: 100%;
  }

  .hero h2 {
    font-size: 24px;
  }

  .hero p {
    font-size: 14px;
  }

  .service-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>外出支援 KATAOKAサービス</h1>
  </div>
</header>

<nav>
  <ul>
    <li><a href="#">HOME</a></li>
    <li><a href="#">BLOG 一覧</a></li>
  </ul>
</nav>

<section class="hero">
  <h2>あなたの「したい」を支えます</h2>
  <p>介護保険では対応できない外出支援</p>
</section>

<section class="services">
  <div class="inner">
    <div class="section-title">
      <h3>KATAOKAサービスが選ばれる理由</h3>
    </div>

    <div class="service-grid">
      <div class="service-item">
        <h4>柔軟な外出支援</h4>
        <p>通院・買い物・旅行など幅広く対応。</p>
      </div>
      <div class="service-item">
        <h4>迅速対応</h4>
        <p>急なご依頼にも可能な限り対応。</p>
      </div>
      <div class="service-item">
        <h4>専門スタッフ</h4>
        <p>介護福祉士が同行し安心を提供。</p>
      </div>
    </div>
  </div>
</section>

<section class="contact">
  <div class="inner">
    <div class="section-title">
      <h3>お問い合わせ</h3>
    </div>
    <p>KATAOKAservice@gmail.com</p>
  </div>
</section>

<footer>
  © 2025 外出支援 KATAOKAサービス
</footer>

</body>
</html>
```
