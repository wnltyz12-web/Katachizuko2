<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    /* =========================
       Reset
    ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    /* =========================
       Background Ornament
    ========================= */
    .ornament-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* =========================
       Top Ivory Bar
    ========================= */
    .top-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    /* =========================
       Page Wrapper
    ========================= */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* =========================
       Japanese Intro Text
    ========================= */
    .japanese-title {
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle {
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider {
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    /* =========================
       Main Frame
    ========================= */
    .frame {
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    /* =========================
       Buttons
    ========================= */
    .button-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 32px;
      margin-top: 10px;
    }

    /* ✅ 오나먼트풍 버튼 */
    .ornament-btn {
      position: relative;
      width: 330px;
      height: 82px;
      border-radius: 999px;
      border: 1px solid rgba(185, 167, 122, 0.9);
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.55) 0%,
        rgba(240,224,193,0.95) 45%,
        rgba(240,224,193,1) 100%
      );

      cursor: pointer;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 20px;
      letter-spacing: 0.1em;
      color: #2f2a22;
      font-weight: 900;

      box-shadow:
        0 18px 38px rgba(0,0,0,0.18),
        inset 0 2px 0 rgba(255,255,255,0.75),
        inset 0 -2px 0 rgba(0,0,0,0.06);

      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    /* ✅ 안쪽 라인(이중테두리 느낌) */
    .ornament-btn::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 999px;
      border: 1px solid rgba(185, 167, 122, 0.55);
      pointer-events: none;
    }

    /* ✅ 오나먼트 느낌 살짝: 은은한 패턴 오버레이 */
    .ornament-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 320px 320px;
      opacity: 0.10; /* 핵심: 과하면 구림 */
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .ornament-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 24px 55px rgba(0,0,0,0.22),
        inset 0 2px 0 rgba(255,255,255,0.8),
        inset 0 -2px 0 rgba(0,0,0,0.05);
    }

    .ornament-btn:active {
      transform: translateY(0px);
      box-shadow:
        0 16px 35px rgba(0,0,0,0.18),
        inset 0 2px 0 rgba(255,255,255,0.7),
        inset 0 -2px 0 rgba(0,0,0,0.08);
    }

    /* 버튼 글자 위에 패턴 올라오니까 글자 보호 */
    .ornament-btn span {
      position: relative;
      z-index: 2;
    }

    /* =========================
       Responsive
    ========================= */
    @media (max-width: 900px) {
      .ornament-btn { width: 290px; }
    }

    @media (max-width: 768px) {
      .frame {
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }

      .button-row {
        flex-direction: column;
        gap: 18px;
      }

      .ornament-btn {
        width: 100%;
        max-width: 380px;
      }
    }

    @media (max-width: 480px) {
      .page { padding: 64px 16px 96px; }
      .frame { padding: 64px 24px 80px; }
      .japanese-title .subtitle { font-size: 16px; }
      .ornament-btn { height: 78px; font-size: 19px; }
    }
  </style>
</head>

<body>

  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">
          <button class="ornament-btn"><span>【身元保証】</span></button>
          <button class="ornament-btn"><span>【生活支援】</span></button>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
