<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    .frame{
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================
       Ornament Button (FIXED)
    ========================= */
    .orn-btn{
      position: relative;
      width: 460px;
      height: 120px;
      border: none;
      padding: 0;
      cursor: pointer;

      background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
      border-radius: 22px;
      overflow: hidden;

      box-shadow: 0 18px 46px rgba(0,0,0,0.25);
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    /* ✅ 위 장식 / 아래 장식 따로 */
    .orn-btn .orn-top,
    .orn-btn .orn-bot{
      position: absolute;
      left: 0;
      right: 0;
      height: 55%;
      background-image: url("Untitled-1.png"); /* ✅ 지금 네 repo에 존재 */
      background-repeat: no-repeat;
      background-size: 135% auto;
      pointer-events: none;
      z-index: 1;
      opacity: 1;
    }

    /* 위 라인 */
    .orn-btn .orn-top{
      top: -10px;
      background-position: center 25%;
    }

    /* 아래 라인 */
    .orn-btn .orn-bot{
      bottom: -10px;
      background-position: center 75%;
    }

    /* 글로우 */
    .orn-btn .glow{
      position: absolute;
      inset: -30%;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%,
        rgba(214,182,120,0.14) 0%,
        rgba(214,182,120,0.05) 38%,
        rgba(0,0,0,0) 70%
      );
      opacity: 0.9;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }

    /* 텍스트 */
    .orn-btn .label{
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: #f3e1b6;

      text-shadow:
        0 1px 0 rgba(0,0,0,0.75),
        0 0 16px rgba(214,182,120,0.18);
    }

    .orn-btn:hover{
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow: 0 24px 62px rgba(0,0,0,0.28);
    }
    .orn-btn:hover .glow{ opacity: 1; }

    .orn-btn:active{
      transform: translateY(0px);
      filter: brightness(0.99);
      box-shadow: 0 16px 44px rgba(0,0,0,0.25);
    }

    @media (max-width: 1000px){
      .orn-btn{ width: 420px; }
      .orn-btn .label{ font-size: 26px; }
    }

    @media (max-width: 768px){
      .frame{
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }

      .button-row{
        flex-direction: column;
        gap: 18px;
      }

      .orn-btn{
        width: 100%;
        max-width: 520px;
        height: 112px;
      }

      .orn-btn .label{ font-size: 26px; }
    }

    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }

      .orn-btn{
        height: 104px;
        border-radius: 18px;
      }
      .orn-btn .label{ font-size: 24px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <button class="orn-btn" type="button">
            <span class="orn-top"></span>
            <span class="orn-bot"></span>
            <span class="glow"></span>
            <span class="label">身元保証</span>
          </button>

          <button class="orn-btn" type="button">
            <span class="orn-top"></span>
            <span class="orn-bot"></span>
            <span class="glow"></span>
            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
