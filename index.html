<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    .frame{
      position: relative;
      padding: 88px 64px 96px;
      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================
       Ornament Line Button (NO OVERLAP)
    ========================= */
    :root{
      --gold: #d8bb73;
      --gold-soft: rgba(216,187,115,0.70);
      --ink: #2f2a22;
    }

    .orn-line-btn{
      position: relative;
      width: 460px;
      height: 170px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
    }

    /* ✅ 텍스트 보호용 흰 박스(오나먼트가 절대 못 침범) */
    .orn-line-btn .label{
      position: relative;
      z-index: 3;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--ink);
      line-height: 1;

      background: rgba(255,255,255,0.92);
      padding: 14px 26px;
      border-radius: 12px;
      box-shadow: 0 0 0 6px rgba(255,255,255,0.62);
    }

    /* ✅ 오나먼트는 항상 label 뒤로 */
    .orn-line-btn svg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .orn-line-btn:hover .label{
      background: rgba(255,255,255,0.96);
    }

    /* Responsive */
    @media (max-width: 1000px){
      .orn-line-btn{ width: 420px; height: 165px; }
      .orn-line-btn .label{ font-size: 30px; }
    }
    @media (max-width: 768px){
      .frame{ padding: 72px 32px 88px; background-size: 140% auto; }
      .button-row{ flex-direction: column; gap: 18px; }
      .orn-line-btn{ width: 100%; max-width: 520px; }
    }
    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }
      .orn-line-btn{ height: 155px; }
      .orn-line-btn .label{ font-size: 26px; padding: 12px 22px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <!-- Button 1 -->
          <button class="orn-line-btn" type="button" aria-label="身元保証">
            <svg viewBox="0 0 460 170" aria-hidden="true">
              <!-- TOP: two lines (split to avoid center) -->
              <line x1="40" y1="48" x2="205" y2="48" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="48" x2="420" y2="48" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="40" y1="56" x2="205" y2="56" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="56" x2="420" y2="56" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <!-- BOTTOM: two lines (split to avoid center) -->
              <line x1="40" y1="114" x2="205" y2="114" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="114" x2="420" y2="114" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="40" y1="122" x2="205" y2="122" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="122" x2="420" y2="122" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <!-- CENTER FLOURISH (kept away from label by split lines) -->
              <path d="M230 48 c-18 0 -26 7 -26 14 c0 7 7 12 14 12 c7 0 12-5 12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 48 c18 0 26 7 26 14 c0 7-7 12-14 12 c-7 0-12-5-12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M230 122 c-18 0 -26 -7 -26 -14 c0 -7 7 -12 14 -12 c7 0 12 5 12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 122 c18 0 26 -7 26 -14 c0 -7 -7 -12 -14 -12 c-7 0-12 5-12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <!-- Side curls -->
              <path d="M40 56 c-18 0 -22 -18 -8 -22 c8 -2 14 4 10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M420 56 c18 0 22 -18 8 -22 c-8 -2 -14 4 -10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M40 114 c-18 0 -22 18 -8 22 c8 2 14 -4 10 -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M420 114 c18 0 22 18 8 22 c-8 2 -14 -4 -10 -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <!-- Diamonds (pairs like your sample) -->
              <polygon points="70,34 80,48 70,62 60,48" fill="var(--gold)"/>
              <polygon points="90,42 96,50 90,58 84,50" fill="var(--gold-soft)"/>

              <polygon points="390,34 400,48 390,62 380,48" fill="var(--gold)"/>
              <polygon points="370,42 376,50 370,58 364,50" fill="var(--gold-soft)"/>

              <polygon points="70,100 80,114 70,128 60,114" fill="var(--gold)"/>
              <polygon points="90,108 96,116 90,124 84,116" fill="var(--gold-soft)"/>

              <polygon points="390,100 400,114 390,128 380,114" fill="var(--gold)"/>
              <polygon points="370,108 376,116 370,124 364,116" fill="var(--gold-soft)"/>
            </svg>

            <span class="label">身元保証</span>
          </button>

          <!-- Button 2 -->
          <button class="orn-line-btn" type="button" aria-label="生活支援">
            <svg viewBox="0 0 460 170" aria-hidden="true">
              <line x1="40" y1="48" x2="205" y2="48" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="48" x2="420" y2="48" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="40" y1="56" x2="205" y2="56" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="56" x2="420" y2="56" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <line x1="40" y1="114" x2="205" y2="114" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="114" x2="420" y2="114" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="40" y1="122" x2="205" y2="122" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>
              <line x1="255" y1="122" x2="420" y2="122" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <path d="M230 48 c-18 0 -26 7 -26 14 c0 7 7 12 14 12 c7 0 12-5 12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 48 c18 0 26 7 26 14 c0 7-7 12-14 12 c-7 0-12-5-12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M230 122 c-18 0 -26 -7 -26 -14 c0 -7 7 -12 14 -12 c7 0 12 5 12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 122 c18 0 26 -7 26 -14 c0 -7 -7 -12 -14 -12 c-7 0-12 5-12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M40 56 c-18 0 -22 -18 -8 -22 c8 -2 14 4 10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M420 56 c18 0 22 -18 8 -22 c-8 -2 -14 4 -10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M40 114 c-18 0 -22 18 -8 22 c8 2 14 -4 10 -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M420 114 c18 0 22 18 8 22 c-8 2 -14 -4 -10 -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <polygon points="70,34 80,48 70,62 60,48" fill="var(--gold)"/>
              <polygon points="90,42 96,50 90,58 84,50" fill="var(--gold-soft)"/>

              <polygon points="390,34 400,48 390,62 380,48" fill="var(--gold)"/>
              <polygon points="370,42 376,50 370,58 364,50" fill="var(--gold-soft)"/>

              <polygon points="70,100 80,114 70,128 60,114" fill="var(--gold)"/>
              <polygon points="90,108 96,116 90,124 84,116" fill="var(--gold-soft)"/>

              <polygon points="390,100 400,114 390,128 380,114" fill="var(--gold)"/>
              <polygon points="370,108 376,116 370,124 364,116" fill="var(--gold-soft)"/>
            </svg>

            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
