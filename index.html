<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    /* =========================
       Reset
    ========================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    /* =========================
       Background Ornament
    ========================= */
    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* =========================
       Top Ivory Bar
    ========================= */
    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    /* =========================
       Layout
    ========================= */
    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* =========================
       Japanese Intro Text
    ========================= */
    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    /* =========================
       Frame
    ========================= */
    .frame{
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    /* =========================
       Buttons Row
    ========================= */
    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================================================
       Ornament Line Button (like your last image)
       - White/transparent button
       - Top+Bottom gold ornaments
       - Text in the middle
    ========================================================= */
    .line-btn{
      position: relative;
      width: 460px;
      height: 140px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    /* 오나먼트 이미지를 "위"에 표시 */
    .line-btn::before{
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      height: 50px;

      background-image: url("Untitled-1.png");
      background-repeat: no-repeat;
      background-position: center 26%;  /* ✅ 위 장식 영역 */
      background-size: 120% auto;

      opacity: 0.9;
      pointer-events: none;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,0.06));
    }

    /* 오나먼트 이미지를 "아래"에 표시 */
    .line-btn::after{
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      height: 50px;

      background-image: url("Untitled-1.png");
      background-repeat: no-repeat;
      background-position: center 74%;  /* ✅ 아래 장식 영역 */
      background-size: 120% auto;

      opacity: 0.9;
      pointer-events: none;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,0.06));
    }

    .line-btn .label{
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #2f2a22;
    }

    /* hover: 살짝만 진하게 */
    .line-btn:hover::before,
    .line-btn:hover::after{
      opacity: 1;
    }
    .line-btn:hover .label{
      color: #201c16;
    }

    /* =========================
       Responsive
    ========================= */
    @media (max-width: 1000px){
      .line-btn{ width: 420px; }
      .line-btn .label{ font-size: 26px; }
    }

    @media (max-width: 768px){
      .frame{
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }

      .button-row{
        flex-direction: column;
        gap: 18px;
      }

      .line-btn{
        width: 100%;
        max-width: 520px;
      }
    }

    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }

      .line-btn{
        height: 132px;
      }
      .line-btn .label{
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <button class="line-btn" type="button" aria-label="身元保証">
            <span class="label">身元保証</span>
          </button>

          <button class="line-btn" type="button" aria-label="生活支援">
            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
