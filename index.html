<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    /* Background Ornament */
    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* Top bar */
    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* Intro */
    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    /* Frame */
    .frame{
      position: relative;
      padding: 88px 64px 96px;
      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================
       Ornament Line Button (SVG)
    ========================= */
    :root{
      /* 샘플이랑 비슷한 금색 */
      --gold: #d8bb73;
      --gold-soft: rgba(216,187,115,0.75);
      --ink: #2f2a22;
    }

    .orn-line-btn{
      position: relative;
      width: 460px;
      height: 160px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
    }

    .orn-line-btn svg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .orn-line-btn .label{
      position: relative;
      z-index: 2;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--ink);
      line-height: 1;
      transform: translateY(1px);
    }

    /* hover: 살짝만 강조 */
    .orn-line-btn:hover .label{ color:#201c16; }
    .orn-line-btn:hover svg{ filter: drop-shadow(0 1px 0 rgba(0,0,0,0.04)); }

    /* Responsive */
    @media (max-width: 1000px){
      .orn-line-btn{ width: 420px; height: 155px; }
      .orn-line-btn .label{ font-size: 28px; }
    }
    @media (max-width: 768px){
      .frame{
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }
      .button-row{
        flex-direction: column;
        gap: 18px;
      }
      .orn-line-btn{
        width: 100%;
        max-width: 520px;
      }
    }
    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }
      .orn-line-btn{ height: 145px; }
      .orn-line-btn .label{ font-size: 25px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <!-- Button 1 -->
          <button class="orn-line-btn" type="button" aria-label="身元保証">
            <!-- SVG ornament (drawn) -->
            <svg viewBox="0 0 460 160" aria-hidden="true">
              <!-- top double lines -->
              <line x1="48" y1="42" x2="412" y2="42" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="48" y1="50" x2="412" y2="50" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <!-- bottom double lines -->
              <line x1="48" y1="110" x2="412" y2="110" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="48" y1="118" x2="412" y2="118" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <!-- center flourish (top) -->
              <path d="M230 44
                       c-18 0 -26 7 -26 14
                       c0 7 7 12 14 12
                       c7 0 12-5 12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 44
                       c18 0 26 7 26 14
                       c0 7-7 12-14 12
                       c-7 0-12-5-12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <!-- center flourish (bottom, mirrored) -->
              <path d="M230 116
                       c-18 0 -26 -7 -26 -14
                       c0 -7 7 -12 14 -12
                       c7 0 12 5 12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 116
                       c18 0 26 -7 26 -14
                       c0 -7 -7 -12 -14 -12
                       c-7 0-12 5-12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <!-- side curls (top left / top right) -->
              <path d="M48 50
                       c-18 0 -22 -18 -8 -22
                       c8 -2 14 4 10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M412 50
                       c18 0 22 -18 8 -22
                       c-8 -2 -14 4 -10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <!-- side curls (bottom left / bottom right) -->
              <path d="M48 110
                       c-18 0 -22 18 -8 22
                       c8 2 14 -4 10 -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M412 110
                       c18 0 22 18 8 22
                       c-8 2 -14 -4 -10 -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <!-- diamonds (top left / top right) -->
              <polygon points="76,28 86,42 76,56 66,42" fill="var(--gold)"/>
              <polygon points="96,36 102,44 96,52 90,44" fill="var(--gold-soft)"/>
              <polygon points="384,28 394,42 384,56 374,42" fill="var(--gold)"/>
              <polygon points="364,36 370,44 364,52 358,44" fill="var(--gold-soft)"/>

              <!-- diamonds (bottom left / bottom right) -->
              <polygon points="76,104 86,118 76,132 66,118" fill="var(--gold)"/>
              <polygon points="96,112 102,120 96,128 90,120" fill="var(--gold-soft)"/>
              <polygon points="384,104 394,118 384,132 374,118" fill="var(--gold)"/>
              <polygon points="364,112 370,120 364,128 358,120" fill="var(--gold-soft)"/>
            </svg>

            <span class="label">身元保証</span>
          </button>

          <!-- Button 2 -->
          <button class="orn-line-btn" type="button" aria-label="生活支援">
            <svg viewBox="0 0 460 160" aria-hidden="true">
              <line x1="48" y1="42" x2="412" y2="42" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="48" y1="50" x2="412" y2="50" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <line x1="48" y1="110" x2="412" y2="110" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <line x1="48" y1="118" x2="412" y2="118" stroke="var(--gold-soft)" stroke-width="2" stroke-linecap="round"/>

              <path d="M230 44 c-18 0 -26 7 -26 14 c0 7 7 12 14 12 c7 0 12-5 12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 44 c18 0 26 7 26 14 c0 7-7 12-14 12 c-7 0-12-5-12-10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M230 116 c-18 0 -26 -7 -26 -14 c0 -7 7 -12 14 -12 c7 0 12 5 12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M230 116 c18 0 26 -7 26 -14 c0 -7 -7 -12 -14 -12 c-7 0-12 5-12 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M48 50 c-18 0 -22 -18 -8 -22 c8 -2 14 4 10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M412 50 c18 0 22 -18 8 -22 c-8 -2 -14 4 -10 10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <path d="M48 110 c-18 0 -22 18 -8 22 c8 2 14 -4 10 -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
              <path d="M412 110 c18 0 22 18 8 22 c-8 2 -14 -4 -10  -10"
                    fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>

              <polygon points="76,28 86,42 76,56 66,42" fill="var(--gold)"/>
              <polygon points="96,36 102,44 96,52 90,44" fill="var(--gold-soft)"/>
              <polygon points="384,28 394,42 384,56 374,42" fill="var(--gold)"/>
              <polygon points="364,36 370,44 364,52 358,44" fill="var(--gold-soft)"/>

              <polygon points="76,104 86,118 76,132 66,118" fill="var(--gold)"/>
              <polygon points="96,112 102,120 96,128 90,120" fill="var(--gold-soft)"/>
              <polygon points="384,104 394,118 384,132 374,118" fill="var(--gold)"/>
              <polygon points="364,112 370,120 364,128 358,120" fill="var(--gold-soft)"/>
            </svg>

            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
