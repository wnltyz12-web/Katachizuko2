<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    /* =========================
       Reset
    ========================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    /* =========================
       Background Ornament
    ========================= */
    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* =========================
       Top Ivory Bar
    ========================= */
    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    /* =========================
       Layout
    ========================= */
    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* =========================
       Japanese Intro Text
    ========================= */
    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    /* =========================
       Frame
    ========================= */
    .frame{
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    /* =========================
       Buttons Row
    ========================= */
    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================================================
       Ornament Button (FINAL "끝판왕" 버전)
       - Uses Untitled-1.png as top+bottom ornaments (split)
       - Metallic gold text
       - Soft gold glow + hover shine
    ========================================================= */
    .orn-btn{
      position: relative;
      width: 460px;
      height: 120px;
      border: none;
      padding: 0;
      cursor: pointer;

      /* 깊이감 있는 블랙 */
      background: linear-gradient(180deg, #1b1b1b 0%, #050505 100%);
      border-radius: 24px;
      overflow: hidden;

      /* 바깥 그림자 + 내부 살짝 엠보싱 */
      box-shadow:
        0 20px 55px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -10px 18px rgba(0,0,0,0.35);

      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    /* 아주 얇은 골드 테두리 (고급감) */
    .orn-btn::before{
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      border: 1px solid rgba(214,182,120,0.45);
      pointer-events: none;
      z-index: 4;
    }

    /* 오나먼트: 위/아래 분리 */
    .orn-btn .orn-top,
    .orn-btn .orn-bot{
      position: absolute;
      left: 0;
      right: 0;
      height: 62%;
      background-image: url("Untitled-1.png");
      background-repeat: no-repeat;

      /* ✅ 스샷 기준으로 보이게 크게 */
      background-size: 185% auto;

      pointer-events: none;
      z-index: 1;
      opacity: 0.95;
      filter: drop-shadow(0 0 10px rgba(214,182,120,0.10));
    }

    .orn-btn .orn-top{
      top: -20px;
      background-position: center 37%;
    }

    .orn-btn .orn-bot{
      bottom: -20px;
      background-position: center 63%;
    }

    /* 금빛 글로우 (버튼 중앙) */
    .orn-btn .glow{
      position: absolute;
      inset: -35%;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%,
        rgba(214,182,120,0.18) 0%,
        rgba(214,182,120,0.07) 35%,
        rgba(0,0,0,0) 72%
      );
      opacity: 0.85;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    /* 반짝이는 쉬머(hover때 지나감) */
    .orn-btn .shine{
      position: absolute;
      top: -30%;
      left: -60%;
      width: 55%;
      height: 160%;
      z-index: 3;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.16) 35%,
        rgba(255,255,255,0) 70%
      );
      transform: skewX(-18deg);
      opacity: 0;
      pointer-events: none;
    }

    /* 메탈릭 골드 텍스트 */
    .orn-btn .label{
      position: relative;
      z-index: 5;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.14em;

      /* 금속 느낌: 그라데이션 텍스트 */
      background: linear-gradient(
        180deg,
        #fff3cf 0%,
        #f0d79e 35%,
        #d9b56d 60%,
        #fff0c8 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 1px 0 rgba(0,0,0,0.75),
        0 0 18px rgba(214,182,120,0.18);
    }

    .orn-btn:hover{
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow:
        0 28px 72px rgba(0,0,0,0.32),
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -10px 18px rgba(0,0,0,0.34);
    }
    .orn-btn:hover .glow{ opacity: 1; }
    .orn-btn:hover .shine{
      opacity: 1;
      animation: shineMove 0.9s ease forwards;
    }

    .orn-btn:active{
      transform: translateY(0px);
      filter: brightness(0.99);
      box-shadow:
        0 18px 52px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -12px 22px rgba(0,0,0,0.42);
    }

    @keyframes shineMove{
      0%   { left: -60%; }
      100% { left: 120%; }
    }

    /* =========================
       Responsive
    ========================= */
    @media (max-width: 1000px){
      .orn-btn{ width: 420px; }
      .orn-btn .label{ font-size: 26px; }
    }

    @media (max-width: 768px){
      .frame{
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }

      .button-row{
        flex-direction: column;
        gap: 18px;
      }

      .orn-btn{
        width: 100%;
        max-width: 520px;
        height: 112px;
      }

      .orn-btn .label{ font-size: 26px; }
    }

    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }

      .orn-btn{
        height: 104px;
        border-radius: 18px;
      }
      .orn-btn::before{ border-radius: 18px; }
      .orn-btn .label{ font-size: 24px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <button class="orn-btn" type="button" aria-label="身元保証">
            <span class="orn-top"></span>
            <span class="orn-bot"></span>
            <span class="glow"></span>
            <span class="shine"></span>
            <span class="label">身元保証</span>
          </button>

          <button class="orn-btn" type="button" aria-label="生活支援">
            <span class="orn-top"></span>
            <span class="orn-bot"></span>
            <span class="glow"></span>
            <span class="shine"></span>
            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
