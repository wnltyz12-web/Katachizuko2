<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    .frame{
      position: relative;
      padding: 88px 64px 96px;
      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================================================
       CSS Ornament Line Button (NO IMAGE)
       - exactly like your sample
    ========================================================= */
    .line-btn{
      position: relative;
      width: 460px;
      height: 160px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .line-btn .label{
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 30px;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: #2f2a22;
    }

    /* GOLD COLOR */
    :root{
      --gold: #d8bb73;
      --gold2: rgba(216,187,115,0.75);
    }

    /* Top double lines */
    .line-btn .top-lines,
    .line-btn .bot-lines{
      position: absolute;
      left: 6%;
      right: 6%;
      height: 48px;
      z-index: 1;
      pointer-events: none;
    }

    .line-btn .top-lines{ top: 18px; }
    .line-btn .bot-lines{ bottom: 18px; }

    /* double line bars */
    .line-btn .top-lines::before,
    .line-btn .top-lines::after,
    .line-btn .bot-lines::before,
    .line-btn .bot-lines::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      height:2px;
      background: var(--gold);
      border-radius: 2px;
    }

    .line-btn .top-lines::before{ top: 10px; opacity: 0.95; }
    .line-btn .top-lines::after { top: 20px; opacity: 0.75; }

    .line-btn .bot-lines::before{ bottom: 20px; opacity: 0.95; }
    .line-btn .bot-lines::after { bottom: 10px; opacity: 0.75; }

    /* center flourish */
    .line-btn .flourish{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 64px;
      z-index: 2;
      pointer-events: none;
    }

    .line-btn .flourish::before,
    .line-btn .flourish::after{
      content:"";
      position:absolute;
      top: 50%;
      width: 62px;
      height: 22px;
      border: 2px solid var(--gold);
      border-color: var(--gold) transparent transparent transparent;
      border-radius: 999px;
      opacity: 0.95;
    }

    .line-btn .flourish::before{
      left: 0;
      transform: translateY(-50%) rotate(0deg);
    }
    .line-btn .flourish::after{
      right: 0;
      transform: translateY(-50%) rotate(180deg);
    }

    /* diamonds on sides */
    .line-btn .dia{
      position:absolute;
      width: 14px;
      height: 14px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.95;
      pointer-events: none;
      z-index: 2;
    }

    .line-btn .dia.tl{ left: 3.2%; top: 22px; }
    .line-btn .dia.tr{ right: 3.2%; top: 22px; }
    .line-btn .dia.bl{ left: 3.2%; bottom: 22px; }
    .line-btn .dia.br{ right: 3.2%; bottom: 22px; }

    /* hover */
    .line-btn:hover .label{ color:#201c16; }
    .line-btn:hover .top-lines::before,
    .line-btn:hover .bot-lines::before{
      opacity: 1;
    }

    @media (max-width: 1000px){
      .line-btn{ width: 420px; }
      .line-btn .label{ font-size: 28px; }
    }
    @media (max-width: 768px){
      .frame{
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }
      .button-row{
        flex-direction: column;
        gap: 18px;
      }
      .line-btn{
        width: 100%;
        max-width: 520px;
      }
    }
    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }

      .line-btn{ height: 150px; }
      .line-btn .label{ font-size: 25px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <button class="line-btn" type="button">
            <span class="top-lines"></span>
            <span class="bot-lines"></span>
            <span class="flourish"></span>
            <span class="dia tl"></span><span class="dia tr"></span>
            <span class="dia bl"></span><span class="dia br"></span>
            <span class="label">身元保証</span>
          </button>

          <button class="line-btn" type="button">
            <span class="top-lines"></span>
            <span class="bot-lines"></span>
            <span class="flourish"></span>
            <span class="dia tl"></span><span class="dia tr"></span>
            <span class="dia bl"></span><span class="dia br"></span>
            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
