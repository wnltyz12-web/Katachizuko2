<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfare Design</title>

  <style>
    /* =========================
       Reset
    ========================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      background-color: #f4f1ea;
    }

    /* =========================
       Background Ornament
    ========================= */
    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* =========================
       Top Ivory Bar
    ========================= */
    .top-bar{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      background-color: #f0e0c1;
    }

    /* =========================
       Layout
    ========================= */
    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 80px 24px 120px;
      display: flex;
      justify-content: center;
    }

    .container{
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* =========================
       Japanese Intro Text
    ========================= */
    .japanese-title{
      margin-bottom: 48px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #3a342a;
      letter-spacing: 0.08em;
      word-break: keep-all;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .japanese-title .subtitle{
      display: inline-block;
      font-size: 17px;
      font-weight: 900;
      text-shadow: 0 0 0.6px rgba(58, 52, 42, 0.65);
      opacity: 0.95;
      white-space: nowrap;
      line-height: 1.4;

      padding: 2px 10px;
      background: linear-gradient(
        transparent 55%,
        rgba(240, 224, 193, 0.95) 55%,
        rgba(240, 224, 193, 0.95) 100%
      );
      border-radius: 10px;
    }

    .japanese-title .divider{
      width: 40px;
      height: 1px;
      margin: 0 auto;
      background-color: #b9a77a;
      opacity: 0.95;
    }

    /* =========================
       Frame
    ========================= */
    .frame{
      position: relative;
      padding: 88px 64px 96px;

      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(1px);

      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 110% auto;

      border-radius: 24px;
      filter: drop-shadow(0 25px 60px rgba(0,0,0,0.25));
    }

    /* =========================
       Buttons Row
    ========================= */
    .button-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 44px;
      margin-top: 10px;
    }

    /* =========================
       Hex Frame Button (like image)
    ========================= */
    .hex-btn{
      position: relative;
      width: 380px;
      height: 88px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      filter: drop-shadow(0 16px 30px rgba(0,0,0,0.22));
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    .hex-btn:hover{
      transform: translateY(-2px);
      filter: drop-shadow(0 22px 42px rgba(0,0,0,0.26));
    }

    .hex-btn:active{
      transform: translateY(0px);
      filter: drop-shadow(0 14px 26px rgba(0,0,0,0.22));
    }

    /* outer line */
    .hex-btn .frame-outer{
      position: absolute;
      inset: 0;
      border-radius: 12px;
      clip-path: polygon(
        6% 0%,
        94% 0%,
        100% 50%,
        94% 100%,
        6% 100%,
        0% 50%
      );
      border: 2px solid rgba(214, 182, 120, 0.95);
      background: linear-gradient(
        180deg,
        rgba(25, 22, 18, 0.88) 0%,
        rgba(18, 16, 13, 0.92) 100%
      );
    }

    /* inner line */
    .hex-btn .frame-inner{
      position: absolute;
      inset: 10px 16px;
      border-radius: 10px;
      clip-path: polygon(
        6% 0%,
        94% 0%,
        100% 50%,
        94% 100%,
        6% 100%,
        0% 50%
      );
      border: 1px solid rgba(214, 182, 120, 0.65);
      pointer-events: none;
    }

    /* corner ornaments (small lines) */
    .hex-btn .orn{
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(214, 182, 120, 0.9);
      opacity: 0.9;
      pointer-events: none;
      transform: rotate(45deg);
    }
    .hex-btn .orn.lt{ left: 18px; top: 18px; border-right: none; border-bottom: none; }
    .hex-btn .orn.rt{ right: 18px; top: 18px; border-left: none; border-bottom: none; }
    .hex-btn .orn.lb{ left: 18px; bottom: 18px; border-right: none; border-top: none; }
    .hex-btn .orn.rb{ right: 18px; bottom: 18px; border-left: none; border-top: none; }

    /* text */
    .hex-btn .label{
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: rgba(244, 228, 190, 0.98);

      text-shadow:
        0 1px 0 rgba(0,0,0,0.6),
        0 0 12px rgba(214, 182, 120, 0.18);
    }

    /* =========================
       Responsive
    ========================= */
    @media (max-width: 900px){
      .hex-btn{ width: 330px; height: 84px; }
      .hex-btn .label{ font-size: 22px; }
    }

    @media (max-width: 768px){
      .frame{
        padding: 72px 32px 88px;
        background-size: 140% auto;
      }
      .button-row{
        flex-direction: column;
        gap: 18px;
      }
      .hex-btn{
        width: 100%;
        max-width: 420px;
      }
    }

    @media (max-width: 480px){
      .page{ padding: 64px 16px 96px; }
      .frame{ padding: 64px 24px 80px; }
      .japanese-title .subtitle{ font-size: 16px; }
      .hex-btn{ height: 78px; }
      .hex-btn .label{ font-size: 20px; }
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>
  <div class="top-bar"></div>

  <main class="page">
    <div class="container">

      <div class="japanese-title">
        <span class="subtitle">おひとりさまの方へ</span>
        <span class="divider"></span>
        <span class="subtitle">子供や孫に迷惑をかけたくない方へ</span>
      </div>

      <section class="frame">
        <div class="button-row">

          <button class="hex-btn" type="button" aria-label="身元保証">
            <span class="frame-outer"></span>
            <span class="frame-inner"></span>
            <span class="orn lt"></span><span class="orn rt"></span>
            <span class="orn lb"></span><span class="orn rb"></span>
            <span class="label">身元保証</span>
          </button>

          <button class="hex-btn" type="button" aria-label="生活支援">
            <span class="frame-outer"></span>
            <span class="frame-inner"></span>
            <span class="orn lt"></span><span class="orn rt"></span>
            <span class="orn lb"></span><span class="orn rb"></span>
            <span class="label">生活支援</span>
          </button>

        </div>
      </section>

    </div>
  </main>
</body>
</html>
