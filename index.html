<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カタオカサービス</title>

  <style>
    /* =========================
       Reset
    ========================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body{
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: #f4f1ea;
      color: #2f2a22;
    }

    :root{
      --ivory: #f0e0c1;         /* 기존 아이보리 */
      --paper: rgba(255,255,255,.72);
      --ink: #2f2a22;
      --muted: #6a5f4a;

      /* 버튼 (3번째 사진 톤) */
      --btn: #b7a18a;
      --btn-text: #ffffff;

      /* PC에서도 모바일처럼 보이게 */
      --mobile-max: 520px;

      --shadow: 0 20px 55px rgba(0,0,0,.16);
      --shadow2: 0 12px 35px rgba(0,0,0,.12);
    }

    /* =========================
       Background Ornament (repeat)
    ========================= */
    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* =========================
       1) Top Header
    ========================= */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      height: 68px;
      background: #ded4c8;
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .topbar .wrap{
      width: 100%;
      max-width: var(--mobile-max);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo{
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .logo-mark{
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.85);
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.35);
    }
    .logo-mark span{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .04em;
    }
    .logo-sub{
      font-size: 10px;
      letter-spacing: .18em;
      opacity: .75;
      margin-top: 2px;
    }

    .brand-title{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 16px;
      letter-spacing: .06em;
      color: #1f1b16;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-title b{ font-weight: 900; }

    /* =========================
       Layout (PC도 모바일처럼)
    ========================= */
    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container{
      width: 100%;
      max-width: var(--mobile-max);
      padding: 18px 16px 110px;
    }

    /* =========================================================
       ✅ 너가 처음 보낸 코드 스타일: "반투명 프레임 + 오나먼트가 더 크게"
       - 새창 느낌 X
       - frame 내부에서 ornament.png를 크게 깔아줌
       - 배경 repeat 오나먼트보다 크게 보이게
    ========================================================= */
    .orn-frame{
      position: relative;
      margin-top: 18px;

      padding: 46px 22px 40px;
      border-radius: 22px;

      background-color: rgba(255,255,255,.72);
      backdrop-filter: blur(1px);

      /* ✅ 프레임 안 오나먼트: 배경보다 "크고" + 중앙 */
      background-image: url("ornament.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 145% auto;   /* 🔥 핵심: 배경보다 더 크게 */

      box-shadow: var(--shadow);
    }

    /* 프레임 상단 아이보리 띠(원하면 유지) */
    .orn-frame::before{
      content:"";
      position:absolute;
      left:0; right:0; top:0;
      height: 18px;
      background: rgba(240,224,193,.75);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      pointer-events: none;
    }

    .orn-title{
      text-align: center;
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      letter-spacing: .10em;
      color: var(--ink);
    }
    .orn-title .line{
      font-size: 16px;
      font-weight: 800;
      line-height: 1.9;
    }
    .orn-title .divider{
      width: 72%;
      height: 1px;
      margin: 18px auto 0;
      background: rgba(0,0,0,.12);
    }

    /* =========================
       Buttons (3번째 사진 톤)
    ========================= */
    .cta-section{
      margin-top: 22px;
    }
    .cta-row{
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cta-btn{
      appearance: none;
      border: none;
      cursor: pointer;

      width: 100%;
      height: 56px;

      background: linear-gradient(#b9a48d, var(--btn));
      color: var(--btn-text);

      border-radius: 10px;
      box-shadow: var(--shadow2);
      letter-spacing: .16em;

      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 18px;
      font-weight: 800;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    .cta-btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 16px 40px rgba(0,0,0,.14);
    }
    .cta-btn:active{
      transform: translateY(0px);
      filter: brightness(.99);
      box-shadow: 0 10px 28px rgba(0,0,0,.12);
    }

    /* reveal */
    .reveal{
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .reveal.is-on{
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>

  <!-- Header -->
  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true"><span>片</span></div>
        <div><div class="logo-sub">KATAOKA</div></div>
      </div>
      <div class="brand-title"><b>外出支援</b>　カタオカサービス</div>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <!-- ✅ 새창 X, 처음 코드처럼 "반투명 + 큰 오나먼트 프레임" -->
      <section class="orn-frame">
        <div class="orn-title">
          <div class="line">おひとりさまの方へ</div>
          <div class="line">子供や孫に迷惑をかけたくない方へ</div>
          <div class="divider"></div>
        </div>
      </section>

      <!-- Buttons appear on scroll -->
      <section class="cta-section reveal" id="cta">
        <div class="cta-row">
          <button class="cta-btn" type="button">身元保証</button>
          <button class="cta-btn" type="button">生活支援</button>
        </div>
      </section>

    </div>
  </main>

  <script>
    const el = document.querySelector('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) el.classList.add('is-on'); });
    }, { threshold: 0.18 });
    io.observe(el);
  </script>
</body>
</html>
