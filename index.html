<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カタオカサービス</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body{
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: #f4f1ea;
      color: #2f2a22;
    }

    :root{
      --ivory: #f0e0c1;
      --paper: #ffffff;
      --ink: #2f2a22;
      --muted: #6a5f4a;

      --btn: #b7a18a;
      --btn-text: #ffffff;

      --shadow: 0 20px 55px rgba(0,0,0,.16);
      --shadow2: 0 12px 35px rgba(0,0,0,.12);
      --radius: 18px;

      /* ✅ "모바일이 기준" 스케일(PC에서도 이 느낌 유지) */
      --mobile-max: 520px;   /* PC에서도 이 폭으로 고정 */
    }

    /* Background */
    .ornament-bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #f4f1ea;
      background-image: url("ornament.png");
      background-repeat: repeat;
      background-size: 260px 260px;
    }

    /* ✅ PC에서도 모바일처럼 중앙에 '얇은 폭'만 보이게 */
    .page{
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .container{
      width: 100%;
      max-width: var(--mobile-max); /* ✅ 핵심 */
      padding: 18px 16px 110px;     /* ✅ 모바일 느낌 유지 */
    }

    /* 1) Top Header */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      height: 68px;                 /* ✅ 모바일 기준으로 고정 */
      background: #ded4c8;
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .topbar .wrap{
      width: 100%;
      max-width: var(--mobile-max); /* ✅ PC에서도 같은 폭 */
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo{
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark{
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.85);
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.35);
      flex: 0 0 auto;
    }
    .logo-mark span{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .04em;
    }
    .logo-sub{
      font-size: 10px;
      letter-spacing: .18em;
      opacity: .75;
      margin-top: 2px;
    }
    .brand-title{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 16px;      /* ✅ 모바일 크기로 고정 */
      letter-spacing: .06em;
      color: #1f1b16;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-title b{ font-weight: 900; }

    /* 2) Hero "window" */
    .hero{
      margin-top: 18px;
      padding: 18px 0 10px;
    }
    .window-card{
      width: 100%;
      background: rgba(255,255,255,.90);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.06);
      overflow: hidden;
    }
    .window-top{
      height: 42px;
      background: linear-gradient(#f7f3ec, #f0e9df);
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
    }
    .dot{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.14);
    }
    .window-top .title{
      margin-left: 10px;
      font-size: 12px;
      letter-spacing: .06em;
      color: rgba(47,42,34,.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .window-body{
      padding: 26px 18px 28px; /* ✅ 모바일 기준 */
      text-align: center;
    }
    .window-body .line{
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      color: var(--ink);
      letter-spacing: .10em;
      line-height: 1.9;
      font-size: 16px;     /* ✅ 모바일 기준 */
      font-weight: 700;
    }
    .window-body .line + .line{ margin-top: 8px; }
    .window-divider{
      width: 80%;
      height: 1px;
      margin: 18px auto 0;
      background: rgba(0,0,0,.12);
    }

    /* 3) Buttons (모바일 느낌 유지) */
    .cta-section{
      margin-top: 28px;
      padding-top: 6px;
    }
    .cta-row{
      display: flex;
      flex-direction: column; /* ✅ PC에서도 세로(모바일처럼) */
      gap: 12px;
      align-items: stretch;
    }
    .cta-btn{
      appearance: none;
      border: none;
      cursor: pointer;

      width: 100%;
      height: 56px;

      background: linear-gradient(#b9a48d, var(--btn));
      color: var(--btn-text);

      border-radius: 10px;
      box-shadow: var(--shadow2);
      letter-spacing: .16em;

      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 18px;
      font-weight: 800;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    .cta-btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 16px 40px rgba(0,0,0,.14);
    }
    .cta-btn:active{
      transform: translateY(0px);
      filter: brightness(.99);
      box-shadow: 0 10px 28px rgba(0,0,0,.12);
    }

    /* reveal */
    .reveal{
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .reveal.is-on{
      opacity: 1;
      transform: translateY(0);
    }

    /* ✅ PC에서 모바일과 동일하게 보이게: 더 큰 화면에서도 절대 레이아웃 바꾸지 않음 */
    @media (min-width: 521px){
      /* intentionally empty: PC에서도 모바일 그대로 */
    }
  </style>
</head>

<body>
  <div class="ornament-bg"></div>

  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true"><span>片</span></div>
        <div>
          <div class="logo-sub">KATAOKA</div>
        </div>
      </div>
      <div class="brand-title"><b>外出支援</b>　カタオカサービス</div>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <section class="hero">
        <div class="window-card">
          <div class="window-top">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="title">カタオカサービス</span>
          </div>

          <div class="window-body">
            <div class="line">おひとりさまの方へ</div>
            <div class="line">子供や孫に迷惑をかけたくない方へ</div>
            <div class="window-divider"></div>
          </div>
        </div>
      </section>

      <section class="cta-section reveal" id="cta">
        <div class="cta-row">
          <button class="cta-btn" type="button">身元保証</button>
          <button class="cta-btn" type="button">生活支援</button>
        </div>
      </section>

    </div>
  </main>

  <script>
    const el = document.querySelector('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) el.classList.add('is-on');
      });
    }, { threshold: 0.18 });
    io.observe(el);
  </script>
</body>
</html>
